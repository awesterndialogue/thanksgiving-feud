/* FRIENDLY FEUD — 2026 Thanksgiving makeover.
 * Original autumn board styling drawn with CSS. Optional hosted PowerPoint audio is loaded at runtime when licensed and uploaded.
 * Projector: glowing 2-column orange marquee inspired by the church's existing game.
 * Operator: accessible, crisp controls optimized for the tech-room monitor.
 */
:root{--amber:#ffb531;--orange:#ed670d;--cream:#fff2d4;--ink:#2a180f;--walnut:#301c22;--brown:#552815}
body{background:radial-gradient(circle at top,#51332a,#1d171c 77%)}
/* HOST / OPERATOR */
.host-shell{max-width:1520px;padding:28px clamp(15px,3vw,42px) 64px}
.host-head{background:linear-gradient(115deg,#41281f 0%,#2a2325 68%,#3d2a21);border:1px solid #8f583b;border-radius:18px;padding:20px 24px;box-shadow:0 18px 38px #0003}
.brand{font-family:Georgia,"Times New Roman",serif;color:#ffe5a4;letter-spacing:-.015em;font-size:clamp(27px,3vw,42px)}
.eyebrow,.small-caps{color:#ffbe6c}
.subtle{color:#dbcbbd}.muted{color:#baa79c}
.panel{background:linear-gradient(165deg,#382824,#2b2426 72%);border:1px solid #745346;box-shadow:0 15px 40px #0003;border-radius:16px;padding:22px}
.panel h2{color:#fff0d1}
.btn{border-color:#865c49;background:#563a30;color:#fff2de;border-radius:9px;box-shadow:0 1px 0 #0004}
.btn:hover:not(:disabled){background:#79503b}
.btn.primary{background:linear-gradient(180deg,#ffd184,#ef962d);border-color:#ffcf81;color:#361e17;box-shadow:0 2px 0 #7b3f1b}
.btn.primary:hover:not(:disabled){background:#ffe1a7}
.btn.success{background:#256b55;border-color:#6fc09b}
.btn.danger{background:#8c3028;border-color:#e36c57}
.btn.ghost{border-color:#795745}
.btn:disabled{opacity:.42}
.field,.select,textarea{background:#241d1f;border-color:#81614f;color:#fff6e3}
.field:focus,.select:focus,textarea:focus{border-color:#ffb45a}
.field-label{color:#f6d2aa}
.score-card{background:linear-gradient(180deg,#241d20,#312521);border-color:#87634d}
.score-num{color:#ffd081}
.score-title{color:#e6c69d}
.answer-host{background:#251f22;border-color:#77513e}
.answer-host.revealed{background:#51402a;border-color:#d2943e}
.answer-host .number,.answer-host .points{color:#ffca72}
.round-pill{background:#272124;border-color:#735242}
.round-pill.current{background:#7f481e;border-color:#f7b559}
.round-pill.done{background:#245343;border-color:#609577}
.match-tab{background:#292024;border-color:#80604c}
.match-tab.current{background:linear-gradient(180deg,#ffc678,#e88b2e);border-color:#ffda99;color:#371f16}
.status-label{background:#684125;color:#ffe3b6}
.operator-indicator{color:#c9ebc8}
.format-settings{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin:14px 0;padding:12px;border-radius:10px;background:#231d20;border:1px dashed #83604c}
.format-settings .select{padding:9px}
.sound-import{padding:15px;border:1px solid #866044;background:#241d21;border-radius:12px;margin-top:20px}
.sound-import .btn{display:inline-flex;align-items:center}
.sound-import .tag{margin-left:8px}.sound-routing-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:13px 0}.sound-route{background:#1c1823;border:1px solid #765769;border-radius:10px;padding:10px}.sound-route .field-label{margin-bottom:6px}.sound-route .select{font-size:13px;padding:9px}.sound-help{color:#d4bfc9;font-size:12px}.sound-inventory{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:10px 0}.sound-inventory-item{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12px;background:#221923;border:1px solid #5a4655;border-radius:8px;padding:6px 9px}.sound-inventory-item .ready{color:#b1efc3}.sound-inventory-item .missing{color:#ffb6ad}.sound-inventory-item .checking{color:#dac8d2}@media(max-width:680px){.sound-routing-grid,.sound-inventory{grid-template-columns:1fr}}
@media(max-width:860px){.format-settings{grid-template-columns:1fr}.host-head{padding:16px}}
/* PROJECTOR */
.board.vintage-board{position:relative;isolation:isolate;min-height:100vh;height:100dvh;overflow:hidden;background:
 radial-gradient(circle at 14% 13%,#ffec9e 0%,transparent 26%),
 radial-gradient(circle at 81% 78%,#ffae30 0%,transparent 24%),
 linear-gradient(125deg,#ff9c30 0%,#f7b951 23%,#f4822c 56%,#e76a31 85%,#fda845 100%);
 padding:clamp(14px,2vh,24px) clamp(15px,2vw,30px);color:#fff7e9}
.board.vintage-board::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.30;background:
 radial-gradient(circle at 5% 85%,#ffe29f 0 2px,transparent 3px),
 radial-gradient(circle at 84% 15%,#fffbd3 0 3px,transparent 5px),
 radial-gradient(circle at 51% 41%,#ffecc0 0 2px,transparent 4px);background-size:160px 150px,207px 189px,131px 143px;filter:blur(1px)}
.board.vintage-board::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 130px #b5470a70;z-index:0}
.autumn-lights{position:absolute;inset:0;z-index:0;opacity:.45;pointer-events:none;background:radial-gradient(circle at 20% 22%,white 0 2px,transparent 7px),radial-gradient(circle at 82% 64%,#ffffd7 0 3px,transparent 11px);background-size:111px 136px,173px 173px}
.fall-leaf{position:absolute;z-index:1;pointer-events:none;font-size:clamp(35px,5vw,78px);opacity:.73;filter:drop-shadow(0 3px 4px #9c4b1b70)}
.leaf-a{left:1.1%;top:.8%;transform:rotate(-23deg)}.leaf-b{right:3%;top:1%;transform:rotate(31deg)}
.leaf-c{left:1.5%;bottom:3.5%;transform:rotate(15deg)}.leaf-d{right:2%;bottom:1.5%;transform:rotate(-31deg)}
.corner-turkey{position:absolute;z-index:4;right:clamp(12px,3.5vw,60px);top:clamp(3px,1vh,18px);font-size:clamp(38px,6vw,82px);filter:drop-shadow(2px 7px 4px #75330766)}
.show-marquee{position:absolute;z-index:1;inset:12% 3.2% 7%;pointer-events:none;border-radius:50%;border:clamp(11px,1.7vw,25px) solid #f78b08;background:radial-gradient(ellipse at center,transparent 48%,#ffd48b66 77%,#ffdd9b77 100%);box-shadow:0 10px 25px #75300e7e,0 0 0 5px #6f340e,inset 0 0 0 5px #75300e,inset 0 0 37px #ffe59aaa}
.show-marquee-lights{position:absolute;inset:0;border-radius:50%;background-image:radial-gradient(circle,white 0 3.2px,#fff0ad 3.5px 5px,#fff7da8c 6px,transparent 8px);background-size:clamp(18px,2.5vw,30px) clamp(18px,2.5vw,30px);filter:drop-shadow(0 0 5px white);mask-image:radial-gradient(ellipse at center,transparent 0 61%,#000 65% 94%,transparent 96%);-webkit-mask-image:radial-gradient(ellipse at center,transparent 0 61%,#000 65% 94%,transparent 96%);animation:marquee-shimmer 9s linear infinite}
@keyframes marquee-shimmer{0%{opacity:.85}50%{opacity:1}100%{opacity:.85}}
.board.vintage-board .board-inner{position:relative;z-index:2;width:min(1720px,100%);margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:clamp(6px,1.2vh,15px)}
.board.vintage-board .board-head{text-align:center;flex:none;position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:0}
.board.vintage-board .board-kicker{font-size:clamp(10px,1.1vw,16px);font-weight:950;letter-spacing:.25em;color:#4e2413;text-shadow:0 1px 1px #ffd888;margin:0}
.board.vintage-board .board-kicker.smaller{font-size:clamp(9px,.96vw,14px);letter-spacing:.13em;color:#48200a;background:#ffd082df;border:1px solid #be671f;border-radius:99px;padding:4px 12px;margin-top:1px}
.board.vintage-board .board-title{margin:0;color:#fff7d4;letter-spacing:-.03em;font-family:Impact,Haettenschweiler,"Arial Narrow Bold",system-ui,sans-serif;font-stretch:condensed;font-size:clamp(34px,4.5vw,77px);line-height:1;text-shadow:0 2px 0 #662a0d,2px 5px 0 #a4460e,0 8px 10px #4a1c0d88;-webkit-text-stroke:1.2px #914011;white-space:nowrap}
.board.vintage-board .board-title em{font-style:normal;color:#ffe9aa}
.show-stage{display:grid;grid-template-columns:minmax(115px,.18fr) minmax(0,1fr) minmax(115px,.18fr);gap:clamp(8px,1.5vw,26px);align-items:center;flex:1;min-height:0;padding:0 clamp(0px,.8vw,12px)}
.score-plaque{position:relative;z-index:3;background:linear-gradient(180deg,#ff972d 0 28%,#d34513 29%,#ec4d11 100%);border:clamp(2px,.3vw,4px) solid #9a4a09;border-radius:13px;box-shadow:inset 0 1px 0 #ffe4a0,0 6px 16px #6f250c6b;text-align:center;min-width:0;overflow:hidden;padding:0 0 clamp(8px,1vw,15px)}
.score-plaque .score-name{color:#fff7dc;font-size:clamp(11px,1.45vw,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.025em;font-weight:950;text-shadow:0 1px 1px #51270e;background:linear-gradient(#ff9719,#f87911);padding:clamp(9px,1vw,15px) 5px;border-bottom:2px solid #a7470e}

function encodePastorSnapshot(matches){
 const json=JSON.stringify({v:1,g:matches});
 const bytes=new TextEncoder().encode(json);
 let binary='';for(const b of bytes)binary+=String.fromCharCode(b);
 return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodePastorSnapshot(encoded){
 if(!encoded||encoded.length>18000)throw new Error('Link missing or too long');
 const base64=encoded.replace(/-/g,'+').replace(/_/g,'/');
 const binary=atob(base64);
 const data=new Uint8Array(binary.length);
 for(let i=0;i<binary.length;i++)data[i]=binary.charCodeAt(i);
 const payload=JSON.parse(new TextDecoder().decode(data));
 if(payload?.v!==1||!Array.isArray(payload.g)||payload.g.length!==3||
    !payload.g.every(m=>Array.isArray(m)&&[4,5].includes(m.length)&&m.every(x=>
    (Number.isInteger(x)&&x>=0&&x<BUILTIN_QUESTIONS.length)||
    (typeof x==='string'&&x.length>0&&x.length<=500))))throw new Error('Invalid pastor question schedule');
 return payload.g.map(game=>game.map(entry=>typeof entry==='number'?BUILTIN_QUESTIONS[entry].question:entry));
}

  return builtInIndex>=0?builtInIndex:q.question;

}

 <div class="round-bank"><span>${isFinished?'FINAL SCORE':'ROUND BANK'}</span><strong>${isFinished?'★':r.phase==='complete'?(r.awardedPoints??bank):bank}</strong></div>
 ${isFinished?`<section class="winner-stage"><div class="winner-trophy">🏆</div><div class="winner-overline">HAPPY THANKSGIVING!</div><h2>${m.scores[0]===m.scores[1]?'IT’S A TIE!':'THE WINNERS!'}</h2><div class="winner-name">${esc(winningTeam)}</div><div class="winner-score">${m.scores[0]} – ${m.scores[1]}</div><p>A wonderful game, a wonderful gathering.</p><div class="leaf-confetti" aria-hidden="true">🍁 🍂 ✨ 🍁 🍂</div></section>`:`<div class="board-question ${r.questionVisible?questionNew?'question-appearing':'':'question-concealed'}"><p>${r.questionVisible?esc(q.question):`<span class="ready-eyebrow">ROUND ${m.roundIndex+1} · ${multipliers()[m.roundIndex]}× POINTS</span><span class="ready-title">GET READY!</span><span class="ready-subtitle">♫ Intro music · question coming up</span>`}</p></div>
 <section class="board-answers" aria-label="Answer board">${Array.from({length:8},(_,i)=>{
 const a=q.answers[i];const shown=!!a&&r.questionVisible&&(r.revealed.includes(i)||r.postRevealed.includes(i)||r.showAll);const fresh=freshReveals.includes(i);
 return `<div class="board-answer ${shown?'shown':''} ${fresh?'just-revealed':''} ${!a?'empty-answer':''}" style="--grid-row:${i%4+1};--grid-col:${Math.floor(i/4)+1}"><div class="rank">${a?i+1:''}</div><div class="answer-flip"><div class="text">${shown?esc(a.text):a?'● ● ● ● ●':''}</div><div class="answer-points">${shown?a.points:a?'?':''}</div></div></div>`;
 }).join('')}</section>
 <div class="board-status-line"><div class="board-status">${r.phase==='faceoff'?(r.faceoffMisses===2?'🎙 BOTH MISSED · HOST CHOOSES':'🎙 FACE-OFF'):r.phase==='play'?`${esc(teamName(m,r.controlling))} IS PLAYING`:r.phase==='steal'?`STEAL CHANCE · ${esc(teamName(m,opponent(r.controlling)))}`:`ROUND GOES TO ${esc(teamName(m,r.awardedTo))}`}</div><div class="board-strikes">${[0,1,2].map(i=>`<span class="${i<r.strikes?'active':'off'}">✕</span>`).join('')}</div></div>`}
 </div>
 <div class="score-plaque right"><div class="score-name">${esc(teamName(m,1))}</div><div class="score-number ${m.scores[1]!==prior.scores[1]?'score-pop':''}">${m.scores[1]}</div><div class="score-sub">TEAM TWO</div></div>
 </div>
 <footer class="board-label">THANKSGIVING EDITION <span>✦</span> ${q.id.startsWith('church-original-')?'ORIGINAL CHURCH POWERPOINT QUESTIONS':'DEMONSTRATION SCORES ARE ESTIMATES'}</footer>
 </div>${strikeNew?`<div class="strike-burst strike-burst-${strikeBurstCount}" aria-hidden="true">${Array.from({length:strikeBurstCount},()=>'<span class="strike-burst-x">✕</span>').join('')}</div>`:''}</main>`;
 lastBoard={key:roundKey,revealed:[...r.revealed],postRevealed:[...r.postRevealed],questionVisible:r.questionVisible,failedSteal:r.failedSteal,strikes:r.strikes,faceoffMisses:r.faceoffMisses||0,manualSeq:state.manualX?.seq||0,scores:[...m.scores]};
}

function renderHost(){const m=match(),r=round(),q=question(),bank=points(r,q),status=phaseTitle(r),remaining=q.answers.filter((_,i)=>!r.revealed.includes(i)&&!r.postRevealed.includes(i)).length;document.title='Operator — Thanksgiving Feud';document.body.classList.add('host-view');document.body.classList.remove('public-view');const used=new Set(state.matches.flatMap(mm=>mm.rounds.map(rr=>rr.qid)));const selected=state.questions.find(qq=>qq.id===editorMode);const editing=editorMode!==null;const usingOriginal=state.matches.every((mm,mi)=>mm.rounds.length===5&&mm.rounds.every((rr,ri)=>rr.qid===ORIGINAL_EVENT_IDS[mi*5+ri]));const example=selected||{question:'',answers:[]};let editableAnswers=Array.from({length:8},(_,i)=>example.answers[i]||{text:'',points:''});
app.innerHTML=`<main class="host-shell"><header class="host-head"><div><div class="eyebrow">🍁 Thanksgiving Dinner • Live Show Control</div><h1 class="brand">The Great Thanksgiving Feud</h1><div class="subtle tiny">Private controls • Keep this window in the tech room</div></div><div class="toolbar"><span class="operator-indicator">● SYNCED ON THIS COMPUTER</span><button class="btn primary" data-action="open-board">▣ Open projector screen</button><a class="btn ghost" href="${esc(boardUrl())}" target="_blank" rel="noopener">Projector link ↗</a><button class="btn" data-action="sound">${state.sound?'🔊 Sound on':'🔇 Sound off'}</button><button class="btn" data-action="play-theme">♫ Play intro</button><button class="btn danger" data-action="manual-x" title="Flash a single X on projector without adding a strike or changing scores">✕ Manual X (no score)</button><button class="btn" data-action="undo" ${history.length?'':'disabled'}>↶ Undo</button></div></header>${renderPastorSharing()}<div class="event-banner">${usingOriginal?'<strong>✓ Approved lineup loaded:</strong> Original PowerPoint Games 2, 3 and 4 · 5 rounds each · 15 questions.':'<strong>⚠ Previous game lineup saved in this browser.</strong> To use the pastor-approved PowerPoint Games 2–4 (15 questions), click below. This resets scores, but keeps your question library.'}<div class="row"><button class="btn ${usingOriginal?'small':'primary'}" data-action="load-original-event">${usingOriginal?'↻ Reload approved lineup':'🍁 Load approved 15-question lineup'}</button></div></div><div class="host-grid"><section><div class="panel"><div class="panel-top"><div><div class="eyebrow">Tonight's event</div><h2>Match ${state.activeMatch+1} of 3</h2></div><span class="tag">${state.questions.length} QUESTION BOARDS</span></div><div class="match-tabs">${state.matches.map((mm,i)=>`<button class="match-tab ${i===state.activeMatch?'current':''} ${mm.finished?'done':''}" data-action="switch-match" data-i="${i}">${mm.finished?'✓ ':''}GAME ${i+1}</button>`).join('')}</div><div class="format-settings"><div><label class="field-label" for="round-format">ROUNDS PER MATCH</label><select class="select" id="round-format"><option value="4" ${state.roundFormat===4?'selected':''}>4 rounds · 1× / 1× / 2× / 3×</option><option value="5" ${state.roundFormat===5?'selected':''}>5 rounds · 1× / 1× / 1× / 2× / 3×</option></select></div><button class="btn small" data-action="apply-format">Apply format</button></div><div class="name-row">${[0,1].map(i=>`<div><label class="field-label" for="team-${i}">TEAM ${i?'B':'A'} NAME</label><input class="field" id="team-${i}" value="${esc(m.names[i])}" maxlength="35" /></div>`).join('')}</div><div class="row"><button class="btn small" data-action="save-names">Save team names</button><span class="subtle tiny">Scores and progress are saved automatically on this computer.</span></div><div class="score-row">${[0,1].map(i=>`<div class="score-card"><div class="score-title">${esc(teamName(m,i))}</div><div class="score-num">${m.scores[i]}</div><label class="field-label" for="score-edit-${i}">MANUAL SCORE CORRECTION</label><div class="score-actions"><input class="field" id="score-edit-${i}" type="number" min="0" value="${m.scores[i]}" /><button class="btn small" data-action="edit-score" data-i="${i}">Set</button></div></div>`).join('')}</div><div class="small-caps">Match progress</div><div class="round-progress">${m.rounds.map((rr,i)=>`<div class="round-pill ${!m.finished&&m.roundIndex===i?'current':''} ${rr.phase==='complete'?'done':''}">R${i+1} · ${multipliers()[i]}×</div>`).join('')}</div>${m.finished?`<div class="success-note" style="margin-top:16px;font-weight:800">🏆 ${m.scores[0]===m.scores[1]?'Tie game':esc(teamName(m,m.scores[0]>m.scores[1]?0:1))+' wins!'}<div style="margin-top:8px"><button class="btn primary" data-action="next-match" ${state.activeMatch===2?'disabled':''}>Start next match →</button></div></div>`:''}</div><div class="panel library-panel"><div class="panel-top"><div><div class="eyebrow">Question management</div><h2>Question library</h2></div><span class="tag">${state.questions.length} questions</span></div><p class="help">Includes all 20 church PowerPoint boards plus 48 Thanksgiving-specific questions. You can select unused questions, edit or add questions, or import more from JSON.</p><div class="library-controls"><div><label class="field-label" for="question-picker">QUESTION FOR THIS ROUND</label><select class="select" id="question-picker" ${m.finished?'disabled':''}>${state.questions.map(qq=>`<option value="${esc(qq.id)}" ${q.id===qq.id?'selected':''}>${esc(qq.question)} ${used.has(qq.id)&&q.id!==qq.id?'[assigned]':''}</option>`).join('')}</select></div><button class="btn small" data-action="edit-current">Edit selected</button></div><div class="row" style="margin-top:12px"><button class="btn small" data-action="add-question">+ Add question</button><button class="btn small" data-action="export">⇩ Export questions</button><label class="btn small" for="import-file" style="cursor:pointer">⇧ Import JSON</label><input class="hidden" type="file" id="import-file" accept=".json,application/json" /></div>${editing?`<div class="editor-grid"><h3>${editorMode==='new'?'New Thanksgiving question':'Edit question'}</h3><label class="field-label" for="editor-question">QUESTION</label><textarea id="editor-question" rows="2">${esc(example.question)}</textarea><div class="small-caps">Answer / Points (up to 8; leave unused rows blank)</div>${editableAnswers.map((a,i)=>`<div class="editor-answer"><input class="field" id="editor-a-${i}" placeholder="Answer ${i+1}" value="${esc(a.text)}"/><input class="field" id="editor-p-${i}" type="number" min="1" max="100" placeholder="Points" value="${esc(a.points)}"/></div>`).join('')}<div class="help">Enter at least 3 answers. Points must be positive whole numbers and total no more than 200.</div><div class="editor-tools"><button class="btn primary" data-action="save-question">Save question</button><button class="btn" data-action="cancel-edit">Cancel</button></div></div>`:''}<hr class="hr"/>${renderSoundSettings()}<hr class="hr"/><p class="help"><strong>Question sources:</strong> The default three games use the original church PowerPoint Games 2–4. The 48 additional Thanksgiving questions have illustrative, unsurveyed points. All 20 PowerPoint questions remain in the library.</p><button class="btn small danger" data-action="reset">Reset all three matches</button></div></section><section><div class="panel"><div class="panel-top"><div><div class="eyebrow">${m.finished?'Match finished':`ROUND ${m.roundIndex+1} OF ${m.rounds.length} • ${multipliers()[m.roundIndex]}× POINTS`}</div><h2>Live round controls</h2></div><span class="status-label">${m.finished?'WINNER CROWNED':status}</span></div>${!m.finished?`<div class="question-cue ${r.questionVisible?'cue-visible':'cue-hidden'}"><div class="small-caps">PROJECTOR QUESTION</div><div class="question-cue-status">${r.questionVisible?'● Visible to the audience':'● Hidden from the audience — ready for intro'}</div>${!r.questionVisible?`<div class="row"><button class="btn small" data-action="play-theme">♫ Play intro music</button><button class="btn primary" data-action="reveal-question">👁 Reveal question</button></div><p class="help">Play the theme with the question concealed. Click Reveal question when the host is ready. Answers and scores remain untouched.</p>`:r.phase==='faceoff'&&!r.revealed.length?`<button class="btn small" data-action="hide-question">Hide question again</button>`:''}</div><div class="question-host">${esc(q.question)}</div><div class="row spread"><span class="small-caps">Reveal any answer • out of order</span><span class="tag">ROUND BANK: ${bank}</span></div><div class="answer-list">${q.answers.map((a,i)=>`<div class="answer-host ${(r.revealed.includes(i)||r.postRevealed.includes(i))?'revealed':''}"><div class="number">${i+1}</div><div class="answer-text">${esc(a.text)}</div><div class="points">${a.points}</div><button class="btn small ${(r.revealed.includes(i)||r.postRevealed.includes(i))?'success':'primary'}" data-action="reveal" data-i="${i}" ${r.revealed.includes(i)||r.postRevealed.includes(i)||!r.questionVisible||(r.phase==='steal'&&r.stealAnswer!==null)?'disabled':''}>${r.revealed.includes(i)?'✓ Scored':r.postRevealed.includes(i)?'✓ Shown':'Reveal'}</button></div>`).join('')}</div><div class="strike-line"><div><div class="small-caps">Wrong answers</div><div class="xs">${[0,1,2].map(i=>i<r.strikes?'✕':'·').join(' ')}</div></div><div class="row"><button class="btn danger" data-action="strike" ${r.phase!=='play'?'disabled':''}>✕ Strike</button><button class="btn small" data-action="remove-strike" ${!r.strikes||r.phase==='complete'?'disabled':''}>− Strike</button></div></div>${r.phase==='faceoff'?`<div class="control-section"><p class="help">Opening face-off: record a wrong guess with <strong>Face-off X</strong>. These misses are separate from the three strikes during team play. If both contestants miss, let the host choose which team takes control.</p><div class="row"><button class="btn danger" data-action="faceoff-strike" ${!r.questionVisible||r.faceoffMisses>=2?'disabled':''}>✕ Face-off X (${r.faceoffMisses}/2)</button></div><div class="row"><button class="btn primary" data-action="control" data-i="0" ${!r.questionVisible?'disabled':''}>${esc(teamName(m,0))} plays</button><button class="btn primary" data-action="control" data-i="1" ${!r.questionVisible?'disabled':''}>${esc(teamName(m,1))} plays</button></div></div>`:r.phase==='play'?`<div class="control-section"><div class="success-note">▶ ${esc(teamName(m,r.controlling))} controls the board. Reveal correct answers or record up to three strikes.</div><p class="help">When all answers are found, award the bank. After three strikes, the other team gets one chance to steal.</p><button class="btn success full" data-action="award" data-i="${r.controlling}">✓ Award ${bank} points to ${esc(teamName(m,r.controlling))}</button><button class="btn small" data-action="pass-control">Change controlling team (no points awarded)</button></div>`:r.phase==='steal'?`<div class="control-section"><div class="warn">⚡ ${esc(teamName(m,opponent(r.controlling)))} has ONE steal attempt. ${r.stealAnswer!==null?'A correct answer was revealed: only a successful steal is available.':'If the guess is correct, reveal it above; otherwise click Failed steal.'}</div>${r.stealAnswer!==null?`<button class="btn success full" data-action="award" data-i="${opponent(r.controlling)}">✓ Confirm successful steal (${bank} pts)</button>`:`<button class="btn danger full" data-action="award" data-i="${r.controlling}">✕ Failed steal — original team wins ${bank}</button>`}</div>`:`<div class="control-section"><div class="success-note">✓ ${esc(teamName(m,r.awardedTo))} received ${r.awardedPoints??bank} points. ${remaining?`${remaining} unguessed answer${remaining===1?'':'s'} remaining.`:'All answers revealed.'}</div><p class="help">Reveal the remaining answers one at a time using their individual Reveal buttons above, or Reveal next below. These are for the audience only — the round score is locked.</p><div class="row"><button class="btn primary" data-action="reveal-next" ${remaining?'':'disabled'}>👁 Reveal next hidden answer (${remaining})</button><button class="btn" data-action="next-round">${m.roundIndex===m.rounds.length-1?'🏆 Crown the winner':'Next round →'}</button></div></div>`}`:`<p class="help">This match has finished. You can switch games above, or start the next match.</p>`}<hr class="hr"/><div class="small-caps">Operator tips</div><p class="help">Numbers 1–8 reveal answers. <strong>X</strong> records a team-play strike; use Face-off X for opening misses and Manual X for a no-score flash. <strong>Q</strong> reveals the question. <strong>Z</strong> undoes the last change. In the tech room, drag the separate projector window to the projector display and make it full-screen (usually F11).</p></div></section></div><div class="footer">Built for your church's Thanksgiving dinner • Data stays in this browser unless exported • No paid hosting or server required</div></main>`;}
function boardUrl(){const url=new URL(location.href);url.searchParams.set('screen','board');return url.toString();}
function render(){if(SCREEN==='board')renderBoard();else if(SCREEN==='pastor')renderPastor();else if(SCREEN==='print')renderPastorPrintable();else renderHost();}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const action=target.dataset.action;const i=Number(target.dataset.i);switch(action){case 'copy-pastor':copyPastorLink();break;case 'toggle-pastor-qr':showPastorQr=!showPastorQr;renderHost();break;case 'pastor-single':pastorMode='single';renderPastor();break;case 'pastor-all':pastorMode='all';renderPastor();break;case 'pastor-prev':changePastorPosition(pastorIndex-1);break;case 'pastor-next':changePastorPosition(pastorIndex+1);break;case 'pastor-jump':changePastorPosition(pastorSchedule.slice(0,i).reduce((n,g)=>n+g.length,0));pastorMode='single';renderPastor();break;case 'pastor-print':window.print();break;case 'open-board':launchBoard();break;case 'undo':undo();break;case 'sound':mutate(s=>s.sound=!s.sound);if(!state.sound)stopIntro();break;case 'save-names':{const names=[0,1].map(i=>document.getElementById('team-'+i)?.value.trim()||`Team ${i?'B':'A'}`);mutate(()=>{match().names=names;});break;}case 'switch-match':mutate(s=>s.activeMatch=i);editorMode=null;break;case 'next-match':if(state.activeMatch<2){mutate(s=>s.activeMatch++);editorMode=null;}break;case 'reveal':reveal(i);break;case 'reveal-next':revealNextRemaining();break;case 'reveal-question':revealQuestion();break;case 'hide-question':concealQuestion();break;case 'strike':strike();break;case 'faceoff-strike':faceoffStrike();break;case 'manual-x':manualX();break;case 'load-original-event':loadOriginalEvent();break;case 'remove-strike':if(round().strikes>0&&round().phase!=='complete')mutate(()=>{const r=round();r.strikes--;if(r.phase==='steal'){r.phase='play';r.stealAnswer=null;}});break;case 'control':startPlay(i);break;case 'pass-control':if(round().phase==='play')mutate(()=>{round().controlling=opponent(round().controlling);});break;case 'award':award(i);break;case 'next-round':nextRound();break;case 'edit-score':editScore(i);break;case 'reset':resetEvent();break;case 'apply-format':applyFormat();break;case 'play-theme':sound('intro');break;case 'check-sounds':checkHostedSounds();showToast('Checking all nine hosted WAV files…');break;case 'test-file':testSoundFile(target.dataset.file);break;case 'stop-music':stopIntro();showToast('Intro music stopped.');break;case 'reset-sound-routes':resetSoundRoutes();break;case 'add-question':editorMode='new';render();break;case 'edit-current':editorMode=round().qid;render();break;case 'cancel-edit':editorMode=null;render();break;case 'save-question':saveEditor();break;case 'export':exportQuestions();break;}});
document.addEventListener('toggle',e=>{if(e.target?.id==='advanced-audio')advancedSoundsOpen=e.target.open;},true);
document.addEventListener('change',e=>{if(e.target.matches('[data-sound-event]')){updateSoundRoute(e.target.dataset.soundEvent,e.target.value);}else if(e.target.id==='question-picker'){pickQuestion(e.target.value);}else if(e.target.id==='import-file'){importFile(e.target.files?.[0]);}else if(e.target.id==='sound-files'){importSounds([...e.target.files]);}});
document.addEventListener('keydown',e=>{if(SCREEN!=='host'||e.altKey||e.metaKey||e.ctrlKey||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))return;const k=e.key.toLowerCase();if(/^[1-8]$/.test(k))reveal(Number(k)-1);else if(k==='x')strike();else if(k==='q')revealQuestion();else if(k==='z')undo();});
render();
if(SCREEN==='host')checkHostedSounds();
})();
