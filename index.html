  <script>
/* The Great Thanksgiving Feud — vanilla JavaScript, no dependencies or accounts. */
(() => {
'use strict';
const KEY='thanksgiving-feud-demo-v1';
const SCREEN=new URLSearchParams(location.search).get('screen')==='board'?'board':'host';
const app=document.getElementById('app');
const multipliers=[1,1,2,3];
const MAX_HISTORY=60;
const clone=x=>JSON.parse(JSON.stringify(x));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newRound=qid=>({qid,revealed:[],strikes:0,controlling:null,phase:'faceoff',stealAnswer:null,awardedTo:null,showAll:false});
const newMatch=(number,qs)=>({names:[`Team A`,`Team B`],scores:[0,0],roundIndex:0,rounds:Array.from({length:4},(_,i)=>newRound(qs[number*4+i]?.id||qs[(number*4+i)%qs.length].id)),finished:false});
const defaultState=()=>({revision:1,activeMatch:0,matches:[0,1,2].map(i=>newMatch(i,BUILTIN_QUESTIONS)),questions:clone(BUILTIN_QUESTIONS),sound:true});
let state;
try { const stored=JSON.parse(localStorage.getItem(KEY)); state=(stored&&stored.matches?.length===3&&Array.isArray(stored.questions)&&stored.questions.length)?stored:defaultState(); }
catch {state=defaultState();}
const history=[];
let editorMode=null; // null, 'new', or question ID
let flashMessage='';
let channel;
try {channel=new BroadcastChannel(KEY); channel.onmessage=e=>receive(e.data);}catch{}
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{receive(JSON.parse(e.newValue));}catch{}}});
function receive(incoming){if(incoming && incoming.revision>state.revision){state=incoming;render();}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){showToast('Browser storage is unavailable. This session may not be saved.');}try{channel?.postMessage(state);}catch{}}
function mutate(operation){history.push(clone(state));if(history.length>MAX_HISTORY)history.shift();operation(state);state.revision+=1;persist();render();}
function undo(){if(!history.length){showToast('Nothing to undo yet.');return;}state=history.pop();state.revision+=1;persist();render();showToast('Last action undone.');}
function showToast(msg){flashMessage=msg;const old=document.querySelector('.toast');old?.remove();const toast=document.createElement('div');toast.className='toast';toast.textContent=msg;document.body.appendChild(toast);setTimeout(()=>toast.remove(),4000);}
const match=()=>state.matches[state.activeMatch];
const round=()=>match().rounds[match().roundIndex];
const question=()=>state.questions.find(q=>q.id===round().qid)||state.questions[0];
const points=(r,q)=>r.revealed.reduce((sum,i)=>sum+(q.answers[i]?.points||0),0)*multipliers[match().roundIndex];
const opponent=i=>1-i;
const teamName=(m,i)=>m.names[i]||`Team ${i?'B':'A'}`;
const phaseTitle=r=>({faceoff:'FACE-OFF',play:'TEAM PLAY',steal:'STEAL CHANCE',complete:'ROUND COMPLETE'})[r.phase]||r.phase;
function sound(type){if(!state.sound||SCREEN!=='host')return;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;const ctx=new Audio();const tones=type==='strike'?[[180,.15],[145,.25]]:type==='winner'?[[523,.12],[659,.12],[784,.12],[1047,.35]]:type==='award'?[[523,.11],[659,.11],[784,.26]]:[[660,.09],[880,.15]];let t=ctx.currentTime+.005;tones.forEach(([hz,d])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type==='strike'?'sawtooth':'sine';o.frequency.setValueAtTime(hz,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.085,t+.013);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.02);t+=d+.015;});setTimeout(()=>ctx.close().catch(()=>{}),1300);}catch{}}
function launchBoard(){const url=new URL(location.href);url.searchParams.set('screen','board');const win=window.open(url.toString(),'thanksgiving-feud-projector','popup=yes,width=1350,height=850');if(!win)showToast('Pop-up blocked. Open the projector link manually in a new tab.');}
function changeName(i,value){mutate(s=>{s.matches[s.activeMatch].names[i]=value.slice(0,35)||`Team ${i?'B':'A'}`;});}
function reveal(i){const r=round();const q=question();if(i<0||i>=q.answers.length||r.phase==='complete')return;if(r.revealed.includes(i))return;if(r.phase==='steal'&&r.stealAnswer!==null){showToast('A steal gets only one answer. Undo if you selected the wrong one.');return;}mutate(s=>{const rr=round();rr.revealed.push(i);if(rr.phase==='steal')rr.stealAnswer=i;});sound('reveal');}
function strike(){const r=round();if(r.phase!=='play')return;mutate(()=>{const rr=round();rr.strikes=Math.min(3,rr.strikes+1);if(rr.strikes===3)rr.phase='steal';});sound('strike');}
function startPlay(i){if(round().phase!=='faceoff')return;mutate(()=>{const r=round();r.controlling=i;r.phase='play';});}
function award(i){const r=round(),m=match();if(r.phase==='complete')return;
 if(r.controlling===null){showToast('Choose which team controls the round first.');return;}
 const amount=points(r,question());mutate(()=>{const mm=match(),rr=round();mm.scores[i]+=amount;rr.awardedTo=i;rr.phase='complete';rr.showAll=true;});sound('award');showToast(`${teamName(m,i)} receives ${amount} points.`);
}
function nextRound(){if(round().phase!=='complete'){showToast('Award the round before moving on.');return;}const wasLast=match().roundIndex===3;mutate(()=>{const m=match();if(m.roundIndex===3)m.finished=true;else m.roundIndex++;});if(wasLast)sound('winner');}
function pickQuestion(qid){if(!state.questions.some(q=>q.id===qid))return;const current=round();if(current.phase!=='faceoff'||current.revealed.length){showToast('Change the question before revealing answers or starting play. Use Undo to return to the face-off.');return;}const already=state.matches.some(m=>m.rounds.some(r=>r!==current&&r.qid===qid));if(already){showToast('That question is already assigned to another round in this event.');return;}mutate(()=>{match().rounds[match().roundIndex]=newRound(qid);});showToast('Round question changed.');}
function editScore(i){const el=document.getElementById('score-edit-'+i);if(!el)return;const value=Number(el.value);if(!Number.isSafeInteger(value)||value<0||value>999999){showToast('Enter a whole-number score from 0 to 999999.');return;}mutate(()=>{match().scores[i]=value;});showToast('Score corrected.');}
function resetEvent(){if(!confirm('Reset all three matches and scores? Your question library will be kept.'))return;mutate(s=>{const qs=s.questions;s.activeMatch=0;s.matches=[0,1,2].map(i=>newMatch(i,qs));});showToast('Event reset. Question library preserved.');}
function exportQuestions(){const blob=new Blob([JSON.stringify(state.questions,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='thanksgiving-question-library.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function validQuestion(q){return q&&typeof q.question==='string'&&q.question.trim()&&Array.isArray(q.answers)&&q.answers.length>=3&&q.answers.length<=8&&q.answers.every(a=>typeof a.text==='string'&&a.text.trim()&&Number.isInteger(Number(a.points))&&Number(a.points)>0&&Number(a.points)<=100)&&q.answers.reduce((v,a)=>v+Number(a.points),0)<=100;}
async function importFile(file){if(!file)return;try{const input=JSON.parse(await file.text());const list=Array.isArray(input)?input:input.questions;if(!Array.isArray(list)||!list.length||list.length>1000||!list.every(validQuestion))throw new Error('Use an array of questions with 3–8 answers and positive points totaling 100 or less.');const imported=list.map((q,i)=>({id:`import-${Date.now()}-${i}`,question:q.question.trim(),answers:q.answers.map(a=>({text:a.text.trim(),points:Number(a.points)})),category:'Thanksgiving',source:q.source||'Imported; confirm whether scores are surveyed'}));mutate(s=>{s.questions.push(...imported);});showToast(`${imported.length} questions imported.`);}catch(e){showToast('Import failed: '+e.message);}}
function saveEditor(){const title=document.getElementById('editor-question')?.value.trim();const ans=[];for(let i=0;i<8;i++){const t=document.getElementById('editor-a-'+i);const p=document.getElementById('editor-p-'+i);if(t?.value.trim())ans.push({text:t.value.trim(),points:Number(p.value)});}const record={question:title,answers:ans};if(!validQuestion(record)){showToast('Enter a question with 3–8 answers. Each needs points; total must not exceed 100.');return;}if(editorMode==='new'){mutate(s=>s.questions.push({...record,id:`custom-${Date.now()}`,category:'Thanksgiving',source:'Custom question; scores supplied by organizer'}));}else{mutate(s=>{const q=s.questions.find(q=>q.id===editorMode);if(q){q.question=title;q.answers=ans;q.source='Edited question; scores supplied by organizer';}});}editorMode=null;render();showToast('Question saved. Use the round selector to put it into a game.');}
function renderBoard(){const m=match(),r=round(),q=question(),bank=points(r,q),isFinished=m.finished;document.title=`Projector — Thanksgiving Feud`;document.body.classList.add('public-view');document.body.classList.remove('host-view');app.innerHTML=`<main class="board"><div class="grain"></div><div class="board-inner"><header class="board-head"><div class="board-kicker">🍂 THE ANNUAL CELEBRATION 🍂</div><h1 class="board-title">The Great Thanksgiving Feud</h1><div class="board-kicker">GAME ${state.activeMatch+1} OF 3 ${isFinished?'• FINAL RESULTS':`• ROUND ${m.roundIndex+1} OF 4 • ${multipliers[m.roundIndex]}× POINTS`}</div></header><div class="scoreboard"><div class="big-score"><div class="team">${esc(teamName(m,0))}</div><div class="points">${m.scores[0]}</div></div><div class="bank"><div class="label">${isFinished?'FINAL':'ROUND BANK'}</div><div class="value">${isFinished?'🏆':bank}</div></div><div class="big-score"><div class="team">${esc(teamName(m,1))}</div><div class="points">${m.scores[1]}</div></div></div>${isFinished?`<section class="winner-stage"><div class="trophy">🏆</div><h2>${m.scores[0]===m.scores[1]?'IT’S A TIE!':'THE WINNERS!'}</h2><div class="winner-name">${esc(m.scores[0]===m.scores[1]?'Both teams':teamName(m,m.scores[0]>m.scores[1]?0:1))}</div><div class="winner-score">${m.scores[0]} — ${m.scores[1]}</div><div class="winner-note">What a feast. What a game. Happy Thanksgiving!</div></section>`:`<div class="board-question"><p>${esc(q.question)}</p></div><section class="board-answers" aria-label="Answer board">${q.answers.map((a,i)=>{const shown=r.revealed.includes(i)||r.showAll;return `<div class="board-answer ${shown?'shown':''}"><div class="rank">${i+1}</div><div class="text">${shown?esc(a.text):'••••••••••'}</div><div class="answer-points">${shown?a.points:'?'}</div></div>`}).join('')}</section><div class="board-bottom"><div class="board-status">${r.phase==='faceoff'?'🎙️ FACE-OFF':r.phase==='play'?`${esc(teamName(m,r.controlling))} IS PLAYING`:r.phase==='steal'?`⚡ STEAL CHANCE: ${esc(teamName(m,opponent(r.controlling)))}`:`✓ ROUND AWARDED TO ${esc(teamName(m,r.awardedTo))}`}</div><div class="board-strikes" aria-label="${r.strikes} strikes">${[0,1,2].map(i=>`<span class="${i<r.strikes?'':'off'}">✕</span>`).join('')}</div></div>`}<footer class="board-label">Thanksgiving edition • Demo answer points are illustrative, not actual survey data</footer></div></main>`;}
function renderHost(){const m=match(),r=round(),q=question(),bank=points(r,q),status=phaseTitle(r);document.title='Operator — Thanksgiving Feud';document.body.classList.add('host-view');document.body.classList.remove('public-view');const used=new Set(state.matches.flatMap(mm=>mm.rounds.map(rr=>rr.qid)));const selected=state.questions.find(qq=>qq.id===editorMode);const editing=editorMode!==null;const example=selected||{question:'',answers:[]};let editableAnswers=Array.from({length:8},(_,i)=>example.answers[i]||{text:'',points:''});
app.innerHTML=`<main class="host-shell"><header class="host-head"><div><div class="eyebrow">🍁 Thanksgiving Dinner • Live Show Control</div><h1 class="brand">The Great Thanksgiving Feud</h1><div class="subtle tiny">Private controls • Keep this window in the tech room</div></div><div class="toolbar"><span class="operator-indicator">● SYNCED ON THIS COMPUTER</span><button class="btn primary" data-action="open-board">▣ Open projector screen</button><a class="btn ghost" href="${esc(boardUrl())}" target="_blank" rel="noopener">Projector link ↗</a><button class="btn" data-action="sound">${state.sound?'🔊 Sound on':'🔇 Sound off'}</button><button class="btn" data-action="undo" ${history.length?'':'disabled'}>↶ Undo</button></div></header><div class="host-grid"><section><div class="panel"><div class="panel-top"><div><div class="eyebrow">Tonight's event</div><h2>Match ${state.activeMatch+1} of 3</h2></div><span class="tag">${state.questions.length} QUESTION BOARDS</span></div><div class="match-tabs">${state.matches.map((mm,i)=>`<button class="match-tab ${i===state.activeMatch?'current':''} ${mm.finished?'done':''}" data-action="switch-match" data-i="${i}">${mm.finished?'✓ ':''}GAME ${i+1}</button>`).join('')}</div><div class="name-row">${[0,1].map(i=>`<div><label class="field-label" for="team-${i}">TEAM ${i?'B':'A'} NAME</label><input class="field" id="team-${i}" value="${esc(m.names[i])}" maxlength="35" /></div>`).join('')}</div><div class="row"><button class="btn small" data-action="save-names">Save team names</button><span class="subtle tiny">Scores and progress are saved automatically on this computer.</span></div><div class="score-row">${[0,1].map(i=>`<div class="score-card"><div class="score-title">${esc(teamName(m,i))}</div><div class="score-num">${m.scores[i]}</div><label class="field-label" for="score-edit-${i}">MANUAL SCORE CORRECTION</label><div class="score-actions"><input class="field" id="score-edit-${i}" type="number" min="0" value="${m.scores[i]}" /><button class="btn small" data-action="edit-score" data-i="${i}">Set</button></div></div>`).join('')}</div><div class="small-caps">Match progress</div><div class="round-progress">${m.rounds.map((rr,i)=>`<div class="round-pill ${!m.finished&&m.roundIndex===i?'current':''} ${rr.phase==='complete'?'done':''}">R${i+1} · ${multipliers[i]}×</div>`).join('')}</div>${m.finished?`<div class="success-note" style="margin-top:16px;font-weight:800">🏆 ${m.scores[0]===m.scores[1]?'Tie game':esc(teamName(m,m.scores[0]>m.scores[1]?0:1))+' wins!'}<div style="margin-top:8px"><button class="btn primary" data-action="next-match" ${state.activeMatch===2?'disabled':''}>Start next match →</button></div></div>`:''}</div><div class="panel library-panel"><div class="panel-top"><div><div class="eyebrow">Question management</div><h2>Thanksgiving question library</h2></div><span class="tag">${state.questions.length} questions</span></div><p class="help">Includes 48 original Thanksgiving prompts with illustrative scores. You can select unused questions for any round, add or edit questions, or import more from JSON.</p><div class="library-controls"><div><label class="field-label" for="question-picker">QUESTION FOR THIS ROUND</label><select class="select" id="question-picker" ${m.finished?'disabled':''}>${state.questions.map(qq=>`<option value="${esc(qq.id)}" ${q.id===qq.id?'selected':''}>${esc(qq.question)} ${used.has(qq.id)&&q.id!==qq.id?'[assigned]':''}</option>`).join('')}</select></div><button class="btn small" data-action="edit-current">Edit selected</button></div><div class="row" style="margin-top:12px"><button class="btn small" data-action="add-question">+ Add question</button><button class="btn small" data-action="export">⇩ Export questions</button><label class="btn small" for="import-file" style="cursor:pointer">⇧ Import JSON</label><input class="hidden" type="file" id="import-file" accept=".json,application/json" /></div>${editing?`<div class="editor-grid"><h3>${editorMode==='new'?'New Thanksgiving question':'Edit question'}</h3><label class="field-label" for="editor-question">QUESTION</label><textarea id="editor-question" rows="2">${esc(example.question)}</textarea><div class="small-caps">Answer / Points (up to 8; leave unused rows blank)</div>${editableAnswers.map((a,i)=>`<div class="editor-answer"><input class="field" id="editor-a-${i}" placeholder="Answer ${i+1}" value="${esc(a.text)}"/><input class="field" id="editor-p-${i}" type="number" min="1" max="100" placeholder="Points" value="${esc(a.points)}"/></div>`).join('')}<div class="help">Enter at least 3 answers. Points must be positive whole numbers and total no more than 100.</div><div class="editor-tools"><button class="btn primary" data-action="save-question">Save question</button><button class="btn" data-action="cancel-edit">Cancel</button></div></div>`:''}<hr class="hr"/><p class="help"><strong>Source transparency:</strong> These are original demo questions with plausible, unsurveyed point estimates. The game never claims that 100 people actually answered them.</p><button class="btn small danger" data-action="reset">Reset all three matches</button></div></section><section><div class="panel"><div class="panel-top"><div><div class="eyebrow">${m.finished?'Match finished':`ROUND ${m.roundIndex+1} OF 4 • ${multipliers[m.roundIndex]}× POINTS`}</div><h2>Live round controls</h2></div><span class="status-label">${m.finished?'WINNER CROWNED':status}</span></div>${!m.finished?`<div class="question-host">${esc(q.question)}</div><div class="row spread"><span class="small-caps">Reveal any answer • out of order</span><span class="tag">ROUND BANK: ${bank}</span></div><div class="answer-list">${q.answers.map((a,i)=>`<div class="answer-host ${r.revealed.includes(i)?'revealed':''}"><div class="number">${i+1}</div><div class="answer-text">${esc(a.text)}</div><div class="points">${a.points}</div><button class="btn small ${r.revealed.includes(i)?'success':'primary'}" data-action="reveal" data-i="${i}" ${r.revealed.includes(i)||r.phase==='complete'||(r.phase==='steal'&&r.stealAnswer!==null)?'disabled':''}>${r.revealed.includes(i)?'✓ Shown':'Reveal'}</button></div>`).join('')}</div><div class="strike-line"><div><div class="small-caps">Wrong answers</div><div class="xs">${[0,1,2].map(i=>i<r.strikes?'✕':'·').join(' ')}</div></div><div class="row"><button class="btn danger" data-action="strike" ${r.phase!=='play'?'disabled':''}>✕ Strike</button><button class="btn small" data-action="remove-strike" ${!r.strikes||r.phase==='complete'?'disabled':''}>− Strike</button></div></div>${r.phase==='faceoff'?`<div class="control-section"><p class="help">Run the face-off verbally. Reveal the answers contestants guess, then select the team that won control (or was passed control).</p><div class="row"><button class="btn primary" data-action="control" data-i="0">${esc(teamName(m,0))} plays</button><button class="btn primary" data-action="control" data-i="1">${esc(teamName(m,1))} plays</button></div></div>`:r.phase==='play'?`<div class="control-section"><div class="success-note">▶ ${esc(teamName(m,r.controlling))} controls the board. Reveal correct answers or record up to three strikes.</div><p class="help">When all answers are found, award the bank. After three strikes, the other team gets one chance to steal.</p><button class="btn success full" data-action="award" data-i="${r.controlling}">✓ Award ${bank} points to ${esc(teamName(m,r.controlling))}</button><button class="btn small" data-action="pass-control">Change controlling team (no points awarded)</button></div>`:r.phase==='steal'?`<div class="control-section"><div class="warn">⚡ ${esc(teamName(m,opponent(r.controlling)))} has ONE opportunity to steal. If correct, reveal that answer first; it will be added to the bank.</div><div class="row"><button class="btn success" data-action="award" data-i="${opponent(r.controlling)}" ${r.stealAnswer===null?'disabled':''}>✓ Successful steal (${bank} pts)</button><button class="btn danger" data-action="award" data-i="${r.controlling}">✕ Failed steal — original team wins ${bank}</button></div></div>`:`<div class="control-section"><div class="success-note">✓ ${esc(teamName(m,r.awardedTo))} received ${bank} points. The answer board has been fully revealed.</div><button class="btn primary full" data-action="next-round">${m.roundIndex===3?'🏆 Crown the winner':'Next round →'}</button><button class="btn small" data-action="toggle-show">${r.showAll?'Hide unguessed answers':'Show all answers'}</button></div>`}`:`<p class="help">This match has finished. You can switch games above, or start the next match.</p>`}<hr class="hr"/><div class="small-caps">Operator tips</div><p class="help">Numbers 1–8 reveal answers. <strong>X</strong> records a strike. <strong>Z</strong> undoes the last change. In the tech room, drag the separate projector window to the projector display and make it full-screen (usually F11).</p></div></section></div><div class="footer">Built for your church's Thanksgiving dinner • Data stays in this browser unless exported • No paid hosting or server required</div></main>`;}
function boardUrl(){const url=new URL(location.href);url.searchParams.set('screen','board');return url.toString();}
function render(){if(SCREEN==='board')renderBoard();else renderHost();}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const action=target.dataset.action;const i=Number(target.dataset.i);switch(action){case 'open-board':launchBoard();break;case 'undo':undo();break;case 'sound':mutate(s=>s.sound=!s.sound);break;case 'save-names':{const names=[0,1].map(i=>document.getElementById('team-'+i)?.value.trim()||`Team ${i?'B':'A'}`);mutate(()=>{match().names=names;});break;}case 'switch-match':mutate(s=>s.activeMatch=i);editorMode=null;break;case 'next-match':if(state.activeMatch<2){mutate(s=>s.activeMatch++);editorMode=null;}break;case 'reveal':reveal(i);break;case 'strike':strike();break;case 'remove-strike':if(round().strikes>0&&round().phase!=='complete')mutate(()=>{const r=round();r.strikes--;if(r.phase==='steal'){r.phase='play';r.stealAnswer=null;}});break;case 'control':startPlay(i);break;case 'pass-control':if(round().phase==='play')mutate(()=>{round().controlling=opponent(round().controlling);});break;case 'award':award(i);break;case 'next-round':nextRound();break;case 'toggle-show':mutate(()=>{round().showAll=!round().showAll;});break;case 'edit-score':editScore(i);break;case 'reset':resetEvent();break;case 'add-question':editorMode='new';render();break;case 'edit-current':editorMode=round().qid;render();break;case 'cancel-edit':editorMode=null;render();break;case 'save-question':saveEditor();break;case 'export':exportQuestions();break;}});
document.addEventListener('change',e=>{if(e.target.id==='question-picker'){pickQuestion(e.target.value);}else if(e.target.id==='import-file'){importFile(e.target.files?.[0]);}});
document.addEventListener('keydown',e=>{if(SCREEN!=='host'||e.altKey||e.metaKey||e.ctrlKey||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))return;const k=e.key.toLowerCase();if(/^[1-8]$/.test(k))reveal(Number(k)-1);else if(k==='x')strike();else if(k==='z')undo();});
render();
})();

</script>
</body>
